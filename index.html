<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EMERGE OMNI-SHIELD V20</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --cy: #00F2FF; --mg: #FF4444; --gr: #25D366; --bg: #000; --ios: blur(50px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { 
            padding: calc(env(safe-area-inset-top) + 15px) 25px 15px;
            background: rgba(0,0,0,0.9); backdrop-filter: var(--ios);
            border-bottom: 2px solid var(--cy); display: flex; align-items: center; justify-content: space-between;
        }
        .logo { width: 45px; filter: drop-shadow(0 0 10px var(--cy)); border-radius: 12px; }

        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .screen { display: none; }
        .active { display: block; animation: iosScale 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
        @keyframes iosScale { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        /* VISOR NEURAL V20 */
        .camera-vault {
            width: 100%; height: 380px; border-radius: 50px;
            border: 3px solid var(--cy); overflow: hidden; position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .guide-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75%; height: 30%; border: 2px solid var(--gr); border-radius: 20px;
            box-shadow: 0 0 15px var(--gr); opacity: 0.5;
        }

        /* RESULTADO CRÍTICO */
        .result-card {
            background: rgba(0,0,0,0.95); border-radius: 40px; padding: 30px;
            margin-top: -60px; position: relative; z-index: 100; border: 2px solid var(--cy);
            text-align: center; backdrop-filter: var(--ios);
        }
        .risk-meter {
            width: 100px; height: 100px; border-radius: 50%; border: 8px solid var(--gr);
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900;
        }
        .danger-mode { border-color: var(--mg) !important; animation: glitch 0.2s infinite; }
        @keyframes glitch { 0% { transform: translate(0) } 50% { transform: translate(-2px, 2px) } 100% { transform: translate(2px, -2px) } }

        .btn-ios { background: var(--cy); color: #000; border: none; width: 100%; padding: 22px; border-radius: 22px; font-size: 17px; font-weight: 800; box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2); margin-top: 15px; }
        
        nav { position: fixed; bottom: 0; width: 100%; padding: 15px 0 calc(env(safe-area-inset-bottom) + 5px); background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { color: #444; text-align: center; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--cy); }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="text-align: center;">
        <div style="font-size: 11px; font-weight: 900; color: white;">OMNI-SHIELD V20</div>
        <div id="purity-status" style="font-size: 8px; color: var(--cy); letter-spacing: 2px;">NEURAL_GUARD_ACTIVE</div>
    </div>
    <i data-lucide="shield-check" style="color:var(--gr)"></i>
</header>

<div class="main-content">
    <div id="scr-scan" class="screen active">
        <div class="camera-vault" id="cam-box">
            <video id="video" autoplay playsinline></video>
            <div class="guide-box"></div>
        </div>
        <div id="ui-main" style="margin-top:25px">
            <button class="btn-ios" onclick="runOmniScan()">INICIAR ANÁLISIS BIO-QUÍMICO</button>
        </div>
        <div id="result-area"></div>
    </div>

    <div id="scr-data" class="screen">
        <h2 style="font-size:32px; letter-spacing:-1.5px">Cerebro Local</h2>
        <div id="history-cont"></div>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="aperture"></i>CORE</div>
    <div class="nav-item" onclick="nav('scr-data', this)"><i data-lucide="database"></i>DATA</div>
    <div class="nav-item" onclick="location.reload()"><i data-lucide="refresh-cw"></i>RESET</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');

    // --- BASE DE DATOS BIO-QUÍMICA AVANZADA (DERIVADOS E INVESTIGACIÓN) ---
    const OMNI_DATABASE = {
        "Methylisothiazolinone (MIT)": { 
            risk: 95, 
            synonyms: ["methylisothiazolinone", "mit", "mi", "2-methyl-4-isothiazolin-3-one", "neolone 950", "kathon cg", "milisotiazolinona", "2682-20-4"] 
        },
        "Methylchloroisothiazolinone (MCI)": { 
            risk: 90, 
            synonyms: ["methylchloroisothiazolinone", "mci", "cmit", "5-chloro-2-methyl-4-isothiazolin-3-one", "clorometilisotiazolinona", "26172-55-4"] 
        },
        "Benzisothiazolinone (BIT)": { 
            risk: 80, 
            synonyms: ["benzisothiazolinone", "bit", "proxel", "nipacide bit", "1,2-benzisothiazol-3(2h)-one", "2634-33-5"] 
        },
        "Hexyl Cinnamal": { 
            risk: 25, 
            synonyms: ["hexyl cinnamal", "hca", "hexyl cinnamic aldehyde", "jasmonal h", "101-86-0", "hexilcinamaldehido"] 
        },
        "Linalool": { 
            risk: 20, 
            synonyms: ["linalool", "linalol", "78-70-6", "licareol", "coriandrol", "dl-linalool"] 
        },
        "Citronellol": { 
            risk: 15, 
            synonyms: ["citronellol", "3,7-dimethyl-6-octen-1-ol", "fema 2309", "106-22-9"] 
        },
        "Fragancias Críticas": { 
            risk: 70, 
            synonyms: ["parfum", "fragrance", "arome", "aroma", "perfume"] 
        }
    };

    const flatBadList = Object.values(OMNI_DATABASE).map(d => d.synonyms).flat();

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1920 } } }).then(s => video.srcObject = s);

    async function runOmniScan() {
        const res = document.getElementById('result-area');
        const ui = document.getElementById('ui-main');
        const cam = document.getElementById('cam-box');
        
        ui.style.display = 'none';
        res.innerHTML = '<div class="result-card">🧠 CALCULANDO RIESGO BIO-QUÍMICO...</div>';

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.filter = 'contrast(1.8) grayscale(1) brightness(0.8)';
        ctx.drawImage(video, 0, 0);
        
        try {
            const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
            const cleanText = text.toLowerCase().replace(/[^a-z0-9]/g, '');

            let totalRisk = 0; let detectedItems = [];

            for (const [group, data] of Object.entries(OMNI_DATABASE)) {
                if (data.synonyms.some(s => cleanText.includes(s.replace(/[^a-z0-9]/g, '')))) {
                    totalRisk += data.risk;
                    detectedItems.push(group);
                }
            }

            totalRisk = Math.min(totalRisk, 100);
            renderOmniResult(totalRisk, detectedItems);

        } catch (e) { location.reload(); }
    }

    function renderOmniResult(risk, items) {
        const res = document.getElementById('result-area');
        const cam = document.getElementById('cam-box');
        const color = risk > 80 ? 'var(--mg)' : (risk > 10 ? 'orange' : 'var(--gr)');
        
        if(risk > 0) {
            cam.classList.add('danger-mode');
            if(navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 500]);
            
            const speech = new SpeechSynthesisUtterance("¡Alerta! Peligro de reacción fuerte detectado.");
            speech.lang = 'es-ES'; window.speechSynthesis.speak(speech);

            res.innerHTML = `
                <div class="result-card" style="border-color:${color}">
                    <div class="risk-meter" style="border-color:${color}; color:${color}; box-shadow: 0 0 20px ${color}55">${risk}%</div>
                    <h2 style="color:${color}; margin:0">${risk >= 85 ? 'PELIGRO CRÍTICO' : 'RIESGO DETECTADO'}</h2>
                    <p style="font-weight:800; font-size:14px; margin:10px 0">${items.join(' + ').toUpperCase()}</p>
                    <p style="font-size:10px; opacity:0.6">PRODUCTO NO SEGURO PARA TU PERFIL</p>
                    <button class="btn-ios" style="background:white; font-size:12px" onclick="location.reload()">NUEVA LECTURA</button>
                </div>`;
        } else {
            res.innerHTML = `
                <div class="result-card" style="border-color:var(--gr)">
                    <div class="risk-meter" style="border-color:var(--gr); color:var(--gr)">0%</div>
                    <h2 style="color:var(--gr); margin:0">BIO-ESCUDO LIMPIO</h2>
                    <p>No se detectan alérgenos en la base de datos de Elias.</p>
                    <button class="btn-ios" style="background:var(--gr); color:black" onclick="location.reload()">CONTINUAR</button>
                </div>`;
        }
    }

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
