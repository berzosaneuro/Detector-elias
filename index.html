<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EMERGE SANCTUARY V22</title>
    
    <!-- Apple Elite Experience -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">

    <!-- Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --cy: #00F2FF; --mg: #FF0055; --gr: #00FF9F; --bg: #000; --ios: blur(40px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { 
            padding: calc(env(safe-area-inset-top) + 15px) 25px 15px;
            background: rgba(0,0,0,0.8); backdrop-filter: var(--ios);
            border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { width: 40px; filter: drop-shadow(0 0 8px var(--cy)); border-radius: 10px; }

        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 130px; }
        .screen { display: none; }
        .active { display: block; animation: iosFade 0.4s ease; }
        @keyframes iosFade { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* VISOR DE CÁMARA PRO */
        .camera-vault { width: 100%; height: 380px; border-radius: 45px; border: 2px solid var(--cy); overflow: hidden; position: relative; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .focus-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; height: 30%; border: 2px solid var(--gr); border-radius: 20px; box-shadow: 0 0 20px var(--gr); opacity: 0.3; }

        /* CARDS GLASS */
        .glass-card { background: rgba(255,255,255,0.04); border-radius: 30px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: var(--ios); }
        .danger-card { border-color: var(--mg) !important; background: rgba(255,0,85,0.05) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .btn-elite { background: var(--cy); color: #000; border: none; width: 100%; padding: 20px; border-radius: 20px; font-size: 16px; font-weight: 800; box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2); }

        /* TAB BAR (4 BOTONES) */
        nav { 
            position: fixed; bottom: 0; width: 100%; padding: 15px 0 calc(env(safe-area-inset-bottom) + 5px);
            background: rgba(0,0,0,0.9); backdrop-filter: var(--ios);
            display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .nav-item { color: #555; text-align: center; font-size: 10px; font-weight: 700; transition: 0.3s; }
        .nav-item.active { color: var(--cy); transform: translateY(-3px); }
        .nav-item i { display: block; margin: 0 auto 5px; width: 22px; }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="text-align: center;">
        <div style="font-size: 11px; font-weight: 900; letter-spacing: 1px;">SANCTUARY 360</div>
        <div id="purity-status" style="font-size: 8px; color: var(--gr); letter-spacing: 2px;">SECURE_LINK_ACTIVE</div>
    </div>
    <i data-lucide="refresh-cw" style="width: 18px; color: var(--cy);" onclick="location.reload()"></i>
</header>

<div class="main-content">
    
    <!-- TAB 1: SCANNER CRÍTICO -->
    <div id="scr-scan" class="screen active">
        <div class="camera-vault">
            <video id="video" autoplay playsinline></video>
            <div class="focus-ring"></div>
            <div style="position:absolute; top:20px; width:100%; text-align:center; font-size:10px; color:var(--cy); font-weight:800; opacity:0.5">MODO PRECISIÓN V22</div>
        </div>
        <div id="scan-ui" style="margin-top:20px">
            <button class="btn-elite" onclick="runCriticalScan()">ESCANEAR SEGURIDAD</button>
        </div>
        <div id="scan-result"></div>
    </div>

    <!-- TAB 2: LISTA INTELIGENTE -->
    <div id="scr-list" class="screen">
        <h2 style="font-size:32px; letter-spacing:-1.5px">Lista Compra</h2>
        <div class="glass-card" style="display:flex; gap:10px">
            <input type="text" id="list-input" placeholder="Añadir producto..." style="background:none; border:none; color:white; flex:1; font-size:18px">
            <button onclick="addToList()" style="background:var(--cy); border:none; border-radius:12px; padding:10px">+</button>
        </div>
        <div id="list-container"></div>
    </div>

    <!-- TAB 3: FINANZAS (TICKETS) -->
    <div id="scr-money" class="screen">
        <h2 style="font-size:32px; letter-spacing:-1.5px">Finanzas</h2>
        <div class="glass-card" style="text-align:center">
            <h1 id="total-money" style="font-size:48px; color:var(--cy); margin:0">0.00€</h1>
            <p style="font-size:10px; opacity:0.5; letter-spacing:2px">GASTOS HOGAR DEL MES</p>
        </div>
        <button class="btn-elite" onclick="scanTicket()">FOTO TICKET GASTO</button>
    </div>

    <!-- TAB 4: HOGAR (SANTUARIO) -->
    <div id="scr-home" class="screen">
        <h2 style="font-size:32px; letter-spacing:-1.5px">Santuario</h2>
        <div class="glass-card" style="border-left:4px solid var(--gr)">
            <b>HABITACIÓN BEBÉ</b><br><small>Estado: 100% Protegido</small>
        </div>
        <div class="glass-module glass-card" style="border-left:4px solid var(--mg)">
            <b>DESPENSA COCINA</b><br><small>Alerta: 1 producto con MI</small>
        </div>
        <div class="glass-card" style="border-left:4px solid var(--cy)">
            <b>BAÑO PRINCIPAL</b><br><small>Sincronizado con mujer</small>
        </div>
    </div>

</div>

<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="maximize"></i>SCAN</div>
    <div class="nav-item" onclick="nav('scr-list', this)"><i data-lucide="shopping-cart"></i>LISTA</div>
    <div class="nav-item" onclick="nav('scr-money', this)"><i data-lucide="wallet"></i>GASTOS</div>
    <div class="nav-item" onclick="nav('scr-home', this)"><i data-lucide="shield-check"></i>HOGAR</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');

    // --- BASE DE DATOS CRÍTICA ELIAS (LISTADO COMPLETO) ---
    const CRITICAL_DB = [
        "methylisothiazolinone", "mit", "mi", "2-methyl-4-isothiazolin-3-one", "neolone", "milisotiazolinona",
        "methylchloroisothiazolinone", "mci", "cmit", "chloromethylisothiazolinone", "kathon", "acticide",
        "benzisothiazolinone", "bit", "proxel", "1,2-benzisothiazol-3(2h)-one", "benzisothiazolone",
        "linalool", "linalol", "78-70-6", "licareol", "coriandrol",
        "citronellol", "citronelol", "106-22-9", "fema 2309",
        "hexyl cinnamal", "hexilcinamaldehido", "hca", "jasmonal h", "101-86-0",
        "parfum", "fragrance", "arome", "aroma", "perfume", "aromas"
    ];

    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1920 } } 
    }).then(s => video.srcObject = s);

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(id === 'scr-money') updateMoney();
    }

    // --- FUNCIÓN 1: ESCÁNER BIO-QUÍMICO ---
    async function runCriticalScan() {
        const res = document.getElementById('scan-result');
        document.getElementById('scan-ui').style.display = 'none';
        res.innerHTML = '<div class="glass-card" style="text-align:center">🧠 ANALIZANDO ADN QUÍMICO...</div>';

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.filter = 'contrast(1.8) grayscale(1)';
        ctx.drawImage(video, 0, 0);
        
        const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
        const cleanText = text.toLowerCase().replace(/[^a-z0-9]/g, '');

        const detected = CRITICAL_DB.filter(bad => {
            const badNorm = bad.replace(/[^a-z0-9]/g, '');
            return cleanText.includes(badNorm);
        });

        if(detected.length > 0) {
            if(navigator.vibrate) navigator.vibrate([400, 200, 400]);
            res.innerHTML = `<div class="glass-card danger-card">
                <h1 style="color:var(--mg); margin:0">🚫 PELIGRO</h1>
                <p style="font-weight:900">${detected.join(' + ').toUpperCase()}</p>
                <p style="font-size:12px; opacity:0.7">DETECTADO EN BASE DE DATOS ELIAS.</p>
                <button class="btn-elite" style="background:white; font-size:12px" onclick="location.reload()">NUEVA LECTURA</button>
            </div>`;
            const speech = new SpeechSynthesisUtterance("Peligro detectado. Producto no seguro.");
            speech.lang = 'es-ES'; window.speechSynthesis.speak(speech);
        } else {
            res.innerHTML = `<div class="glass-card" style="border-color:var(--gr)">
                <h1 style="color:var(--gr); margin:0">✅ SEGURO</h1>
                <p>Escudo Limpio. Sin alérgenos.</p>
                <button class="btn-elite" style="background:var(--gr); color:black; font-size:12px" onclick="location.reload()">CONTINUAR</button>
            </div>`;
        }
    }

    // --- FUNCIÓN 2: LISTA DE COMPRA ---
    function addToList() {
        const val = document.getElementById('list-input').value;
        if(!val) return;
        let list = JSON.parse(localStorage.getItem('e_list_22') || '[]');
        list.push(val);
        localStorage.setItem('e_list_22', JSON.stringify(list));
        document.getElementById('list-input').value = '';
        renderList();
    }

    function renderList() {
        const cont = document.getElementById('list-container');
        let list = JSON.parse(localStorage.getItem('e_list_22') || '[]');
        cont.innerHTML = list.reverse().map(i => `<div class="glass-card" style="padding:15px">${i}</div>`).join('');
    }

    // --- FUNCIÓN 3: FINANZAS TICKETS ---
    async function scanTicket() {
        alert("Escaneando total del ticket...");
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
        const match = text.match(/\d+[,.]\d{2}/);
        if(match) {
            let current = parseFloat(localStorage.getItem('e_money_22') || 0);
            localStorage.setItem('e_money_22', current + parseFloat(match[0].replace(',', '.')));
            updateMoney();
        }
    }

    function updateMoney() {
        const total = localStorage.getItem('e_money_22') || 0;
        document.getElementById('total-money').innerText = parseFloat(total).toFixed(2) + "€";
    }
</script>
</body>
</html>
