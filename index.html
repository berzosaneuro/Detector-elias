<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emerge Detector</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --cyan: #00F2FF; --red: #FF003C; --green: #39FF14; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 40px 20px 15px; text-align: center; border-bottom: 1px solid rgba(0,242,255,0.2); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo { width: 60px; filter: drop-shadow(0 0 8px var(--cyan)); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .camera-box { width: 100%; height: 350px; border-radius: 25px; border: 2px solid var(--cyan); overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,242,255,0.3); }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .danger { border-color: var(--red); color: var(--red); box-shadow: 0 0 15px rgba(255,0,60,0.2); }
        .btn { background: var(--cyan); color: black; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: bold; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        nav { position: fixed; bottom: 0; width: 100%; padding: 20px 0 35px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { color: #555; text-align: center; font-size: 10px; }
        .nav-item.active { color: var(--cyan); }
    </style>
</head>
<body>
<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="font-size: 10px; color: var(--cyan); letter-spacing: 3px; margin-top: 10px;">NEURAL SHIELD ACTIVE</div>
</header>
<div class="main-content">
    <div id="scr-scan" class="screen active">
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <div class="scanner-line"></div>
        </div>
        <button class="btn" onclick="startScan()">INICIAR ESCANEO NEURAL</button>
        <div id="result"></div>
    </div>
    <div id="scr-black" class="screen">
        <h2 style="color:var(--red)">BLACKLIST</h2>
        <div id="blacklist-items">
            <div class="card danger"><b>Producto de Prueba</b><br>Detección activa</div>
        </div>
    </div>
    <div id="scr-stats" class="screen">
        <h2>IMPACTO SEMANAL</h2>
        <canvas id="myChart" style="width:100%; height:300px;"></canvas>
    </div>
</div>
<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="camera"></i><br>SCAN</div>
    <div class="nav-item" onclick="nav('scr-black', this)"><i data-lucide="shield-alert"></i><br>BLACK</div>
    <div class="nav-item" onclick="nav('scr-stats', this)"><i data-lucide="bar-chart-3"></i><br>STATS</div>
</nav>
<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    const badChems = ['linalool', 'citronellol', 'methylisothiazolinone', 'benzisothiazolinone'];
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);
    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }
    async function startScan() {
        const res = document.getElementById('result');
        res.innerHTML = '<div class="card">ANALIZANDO...</div>';
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const { data: { text } } = await Tesseract.recognize(canvas, 'spa');
        let found = badChems.filter(c => text.toLowerCase().includes(c));
        if (found.length > 0) {
            res.innerHTML = `<div class="card danger">⚠️ PELIGRO: ${found.join(', ')}</div>`;
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        } else {
            res.innerHTML = `<div class="card" style="border-color:var(--green); color:var(--green)">✅ PRODUCTO SEGURO</div>`;
        }
    }
    new Chart(document.getElementById('myChart'), {
        type: 'line',
        data: { labels: ['Lun', 'Mar', 'Mie', 'Jue', 'Vie'], datasets: [{ label: 'Tóxicos Evitados', data: [5, 8, 12, 7, 15], borderColor: '#00F2FF', tension: 0.4 }] },
        options: { plugins: { legend: { display: false } } }
    });
</script>
</body>
</html>
