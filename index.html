<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emerge - Elias Shield V7</title>
    
    <!-- CONFIGURACIÓN iPHONE PRO -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --cy: #00F2FF; --mg: #FF0055; --gr: #00FF9F; --or: #FFA500; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; }
        header { padding: calc(env(safe-area-inset-top) + 15px) 20px 15px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); border-bottom: 2px solid var(--cy); z-index: 1000; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo { width: 45px; filter: drop-shadow(0 0 10px var(--cy)); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .screen { display: none; }
        .active { display: block; }
        .camera-container { width: 100%; height: 350px; border-radius: 40px; border: 3px solid var(--cy); overflow: hidden; position: relative; box-shadow: 0 0 30px rgba(0, 242, 255, 0.4); }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .laser { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--cy); box-shadow: 0 0 15px var(--cy); animation: laserMove 2s infinite linear; }
        @keyframes laserMove { 0% { top: 0%; } 100% { top: 100%; } }
        .risk-meter { width: 110px; height: 110px; border-radius: 50%; border: 6px solid var(--bg); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .result-card { background: rgba(0, 0, 0, 0.9); border-radius: 35px; padding: 25px; margin-top: -60px; position: relative; z-index: 10; border: 2px solid var(--cy); backdrop-filter: blur(20px); text-align: center; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .btn-main { background: var(--cy); color: black; border: none; width: 100%; padding: 20px; border-radius: 22px; font-size: 18px; font-weight: 900; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3); }
        .btn-reset { background: rgba(255,255,255,0.1); color: white; border: 1px solid white; padding: 10px 20px; border-radius: 15px; margin-top: 15px; font-size: 12px; }
        nav { position: fixed; bottom: 0; width: 100%; padding: 15px 0 calc(env(safe-area-inset-bottom) + 10px); background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .nav-item { color: #444; text-align: center; font-size: 11px; font-weight: 800; }
        .nav-item.active { color: var(--cy); }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="font-size: 11px; font-weight: 900; color: var(--cy); letter-spacing: 3px;">SHIELD V7 // NEURAL RISK</div>
</header>

<div class="main-content">
    <div id="scr-scan" class="screen active">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="laser"></div>
        </div>
        <div id="ui-box">
            <button class="btn-main" onclick="startNeuralAnalysis()">ESCANEAR PRODUCTO</button>
        </div>
        <div id="result-display"></div>
    </div>
    <div id="scr-data" class="screen">
        <h2 style="color:var(--cy)">HISTORIAL</h2>
        <div id="history-container"></div>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="scan"></i><br>SCAN</div>
    <div class="nav-item" onclick="nav('scr-data', this)"><i data-lucide="database"></i><br>LOGS</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    let history = JSON.parse(localStorage.getItem('elias_v7_data') || '[]');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(f, type, d) {
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = type; osc.frequency.value = f; g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + d);
    }

    // BASE DE DATOS COMPLETA DE ELIAS
    const RISK_DB = {
        "Methylisothiazolinone": { weight: 100, synonyms: ["methylisothiazolinone", "mit", "mi", "2-methyl-4-isothiazolin-3-one", "2-methyl-2h-isothiazol-3-one", "3(2h)-isothiazolona"] },
        "Isotiazolinonas": { weight: 90, synonyms: ["methylchloroisothiazolinone", "benzisothiazolinone", "cmit", "mci", "bit", "isothiazolinone", "1,2-benzisothiazol-3(2h)-one", "proxel"] },
        "Fragancias": { weight: 40, synonyms: ["linalool", "linalol", "citronellol", "78-70-6", "106-22-9", "hexyl cinnamal", "parfum", "fragrance", "arome"] }
    };

    const flatList = Object.values(RISK_DB).map(d => d.synonyms).flat();

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    async function startNeuralAnalysis() {
        const display = document.getElementById('result-display');
        const ui = document.getElementById('ui-box');
        ui.style.display = 'none';
        display.innerHTML = '<div class="result-card">🧠 ANALIZANDO...</div>';
        playBeep(800, 'sine', 0.2);

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        try {
            const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
            const cleanText = text.toLowerCase();
            let maxRisk = 0; let detected = []; let riskColor = 'var(--gr)';

            for (const [name, data] of Object.entries(RISK_DB)) {
                if (data.synonyms.some(s => cleanText.includes(s))) {
                    if (data.weight > maxRisk) maxRisk = data.weight;
                    detected.push(name);
                }
            }

            if (maxRisk > 0) {
                if (maxRisk >= 85) { riskColor = 'var(--mg)'; playBeep(150, 'sawtooth', 0.6); if(navigator.vibrate) navigator.vibrate([300, 100, 300]); }
                else { riskColor = 'var(--or)'; playBeep(400, 'sine', 0.4); }

                display.innerHTML = `
                    <div class="result-card" style="border-color:${riskColor}">
                        <div class="risk-meter" style="border-color:${riskColor}; color:${riskColor}; box-shadow: 0 0 15px ${riskColor}55">${maxRisk}%</div>
                        <h2 style="color:${riskColor}; margin:0">${maxRisk >= 85 ? 'PELIGRO CRÍTICO' : 'RIESGO DETECTADO'}</h2>
                        <p style="font-size:12px; font-weight:bold">${detected.join(' • ')}</p>
                        <button class="btn-reset" onclick="resetUI()">RE-ESCANEAR</button>
                    </div>`;
            } else {
                playBeep(1000, 'sine', 0.2);
                display.innerHTML = `<div class="result-card" style="border-color:var(--gr)"><div class="risk-meter" style="border-color:var(--gr); color:var(--gr)">0%</div><h2 style="color:var(--gr); margin:0">SEGURO</h2><button class="btn-reset" onclick="resetUI()">OTRO</button></div>`;
            }
        } catch (e) { resetUI(); }
    }

    function resetUI() { document.getElementById('result-display').innerHTML = ''; document.getElementById('ui-box').style.display = 'block'; }
</script>
</body>
</html>
