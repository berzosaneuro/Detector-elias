<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EMERGE SHIELD V2.4</title>
    
    <!-- Apple Elite Experience -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --cy: #00F2FF; --mg: #FF0055; --gr: #00FF9F; --bg: #000; --ios: blur(40px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, system-ui, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { padding: calc(env(safe-area-inset-top) + 15px) 25px 15px; background: rgba(0,0,0,0.85); backdrop-filter: var(--ios); border-bottom: 2px solid var(--cy); display: flex; align-items: center; justify-content: space-between; }
        .logo { width: 42px; border-radius: 10px; filter: drop-shadow(0 0 8px var(--cy)); }
        
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 140px; }
        .screen { display: none; }
        .active { display: block; animation: iosSlide 0.4s ease; }
        @keyframes iosSlide { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* CÁMARA DE PRECISIÓN */
        .camera-vault { width: 100%; height: 350px; border-radius: 40px; border: 2px solid var(--cy); overflow: hidden; position: relative; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .focus-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; height: 30%; border: 2px solid var(--gr); border-radius: 20px; opacity: 0.3; }
        .laser { position: absolute; top: 0; width: 100%; height: 3px; background: var(--cy); box-shadow: 0 0 15px var(--cy); animation: scanL 2s infinite linear; }
        @keyframes scanL { 0% { top: 0% } 100% { top: 100% } }

        /* CARDS & BUTTONS */
        .glass-card { background: rgba(255,255,255,0.05); border-radius: 30px; padding: 20px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: var(--ios); }
        .danger-ui { border-color: var(--mg) !important; background: rgba(255,0,85,0.1) !important; animation: glitch 0.3s infinite; }
        @keyframes glitch { 0% { transform: translate(0) } 50% { transform: translate(-2px, 2px) } 100% { transform: translate(2px, -2px) } }

        .btn-ios { background: var(--cy); color: #000; border: none; width: 100%; padding: 22px; border-radius: 22px; font-size: 17px; font-weight: 800; box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2); transition: 0.3s; }

        /* NAV BAR (4 BOTONES FIJOS) */
        nav { position: fixed; bottom: 0; width: 100%; padding: 15px 0 calc(env(safe-area-inset-bottom) + 5px); background: #000; display: flex; justify-content: space-around; border-top: 1px solid #222; z-index: 2000; }
        .nav-item { color: #555; text-align: center; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--cy); }
        .nav-item i { display: block; margin: 0 auto 5px; width: 22px; }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="text-align: center;">
        <div style="font-size: 12px; font-weight: 900;">SHIELD V2.4</div>
        <div style="font-size: 8px; color: var(--gr); letter-spacing: 2px;">CRITICAL_SAFETY_ACTIVE</div>
    </div>
    <i data-lucide="activity" style="color:var(--cy); width:20px"></i>
</header>

<div class="main-content">
    <!-- P1: SCANNER -->
    <div id="scr-scan" class="screen active">
        <div class="camera-vault" id="cam-box">
            <video id="video" autoplay playsinline></video>
            <div class="focus-ring"></div>
            <div class="laser"></div>
        </div>
        <div id="scan-ui" style="margin-top:25px">
            <button class="btn-ios" onclick="runSafetyScan()">ANALIZAR SEGURIDAD V2.4</button>
        </div>
        <div id="result-area"></div>
    </div>

    <!-- P2: BLACKLIST AUTO -->
    <div id="scr-black" class="screen">
        <h2 style="color:var(--mg); font-size:32px; letter-spacing:-1.5px">Lista Negra</h2>
        <div id="black-cont"></div>
    </div>

    <!-- P3: LISTA COMPRA -->
    <div id="scr-list" class="screen">
        <h2 style="font-size:32px; letter-spacing:-1.5px">Neural Shopping</h2>
        <div class="glass-card" style="display:flex; gap:10px">
            <input type="text" id="list-in" placeholder="¿Qué vamos a comprar?" style="background:none; border:none; color:white; flex:1; font-size:18px">
            <button onclick="addToList()" style="background:var(--cy); border:none; border-radius:12px; padding:10px">+</button>
        </div>
        <div id="list-cont"></div>
    </div>

    <!-- P4: GASTOS HOGAR -->
    <div id="scr-home" class="screen">
        <h2 style="font-size:32px; letter-spacing:-1.5px">Economía Hogar</h2>
        <div class="glass-card" style="text-align:center">
            <h1 id="money-cont" style="font-size:48px; color:var(--cy); margin:0">0.00€</h1>
            <p style="font-size:10px; opacity:0.5; letter-spacing:2px">GASTO MERCADONA ACUMULADO</p>
        </div>
        <button class="btn-ios" style="background:none; border:1px solid var(--cy); color:var(--cy)" onclick="scanTicket()">FOTO TICKET GASTO</button>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="maximize"></i>SCAN</div>
    <div class="nav-item" onclick="nav('scr-black', this)"><i data-lucide="shield-off"></i>BLACK</div>
    <div class="nav-item" onclick="nav('scr-list', this)"><i data-lucide="shopping-cart"></i>LISTA</div>
    <div class="nav-item" onclick="nav('scr-home', this)"><i data-lucide="wallet"></i>HOGAR</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    
    // --- MEMORIA NEURAL V2.4 ---
    let blacklist = JSON.parse(localStorage.getItem('e_black_24') || '[]');
    let shopping = JSON.parse(localStorage.getItem('e_list_24') || '[]');
    let totalSpent = parseFloat(localStorage.getItem('e_money_24') || '0');

    // --- BASE DE DATOS DE ALERGENOS ELIAS (BLINDADA) ---
    const ALLERGEN_GROUPS = [
        { canonical: 'methylisothiazolinone', aliases: ['methylisothiazolinone', 'mit', 'mi', '2-methyl-4-isothiazolin-3-one', 'neolone', 'milisotiazolinona'] },
        { canonical: 'methylchloroisothiazolinone', aliases: ['methylchloroisothiazolinone', 'mci', 'cmit', 'chloromethylisothiazolinone', 'kathon'] },
        { canonical: 'benzisothiazolinone', aliases: ['benzisothiazolinone', 'bit', 'proxel', '1,2-benzisothiazol-3(2h)-one'] },
        { canonical: 'linalool', aliases: ['linalool', 'linalol', '78-70-6', 'licareol'] },
        { canonical: 'citronellol', aliases: ['citronellol', 'citronelol', '106-22-9'] },
        { canonical: 'hexyl cinnamal', aliases: ['hexyl cinnamal', 'hexilcinamaldehido', 'hca', 'jasmonal h', '101-86-0'] },
        { canonical: 'parfum', aliases: ['parfum', 'fragrance', 'arome', 'aroma', 'perfume', 'aromas'] }
    ];

    function normalizeText(value) {
        return (value || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim()
            .replace(/\s+/g, ' ');
    }
    function levenshteinDistance(a, b) {
        if (a === b) return 0;
        const m = a.length;
        const n = b.length;
        if (!m) return n;
        if (!n) return m;
        const dp = Array.from({ length: m + 1 }, (_, i) => [i]);
        for (let j = 1; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
            }
        }
        return dp[m][n];
    }

    function hasFuzzyMatch(term, tokens) {
        const termTokens = normalizeText(term).split(' ').filter(Boolean);
        if (!termTokens.length) return false;
        const needed = termTokens.length;
        const threshold = Math.max(1, Math.floor(term.replace(/\s+/g, '').length * 0.12));
        for (let i = 0; i <= tokens.length - needed; i++) {
            const candidate = tokens.slice(i, i + needed).join(' ');
            if (Math.abs(candidate.length - term.length) > threshold) continue;
            if (levenshteinDistance(candidate, term) <= threshold) return true;
        }
        return false;
    }

    function detectAllergens(rawText) {
        const normalized = normalizeText(rawText);
        const compact = normalized.replace(/\s+/g, '');
        const tokens = normalized.split(' ').filter(Boolean);
        const detected = [];

        ALLERGEN_GROUPS.forEach(group => {
            const matched = group.aliases.some(alias => {
                const aliasNorm = normalizeText(alias);
                const aliasCompact = aliasNorm.replace(/\s+/g, '');
                if (!aliasNorm) return false;

                // Alias cortos: solo coincidencia exacta por token para evitar falsos positivos.
                if (aliasCompact.length <= 3) {
                    return tokens.includes(aliasNorm);
                }

                if (normalized.includes(aliasNorm) || compact.includes(aliasCompact)) return true;
                return hasFuzzyMatch(aliasNorm, tokens);
            });

            if (matched) detected.push(group.canonical);
        });

        return detected;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous', width: { ideal: 1920 } } }).then(s => video.srcObject = s);

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(id === 'scr-black') renderBlacklist();
        if(id === 'scr-list') renderShopping();
        if(id === 'scr-home') updateMoney();
    }

    // --- MOTOR DE ESCANEO DE PRECISIÓN V2.4 ---
    async function runSafetyScan() {
        const res = document.getElementById('result-area');
        const cam = document.getElementById('cam-box');
        document.getElementById('scan-ui').style.display = 'none';
        res.innerHTML = '<div class="glass-card" style="text-align:center">🧠 ANALIZANDO CADA MOLÉCULA...</div>';

        if (!video.videoWidth || !video.videoHeight) {
            res.innerHTML = '<div class="glass-card danger-ui">⚠️ Cámara no lista. Espera un segundo y vuelve a intentar.</div>';
            document.getElementById('scan-ui').style.display = 'block';
            return;
        }

        try {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.filter = 'contrast(2) grayscale(1)'; // Máximo contraste para evitar fallos
            ctx.drawImage(video, 0, 0);
            const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
            const detected = detectAllergens(text);

            if(detected.length > 0) {
                cam.classList.add('danger-ui');
                if(navigator.vibrate) navigator.vibrate([500, 100, 500]);
                
                // Auto-guardar en Blacklist
                blacklist.push({ date: new Date().toLocaleDateString(), items: detected });
                localStorage.setItem('e_black_24', JSON.stringify(blacklist));

                res.innerHTML = `<div class="glass-card danger-ui">
                    <h1 style="color:var(--mg); margin:0; font-size:40px">🚫 PELIGRO</h1>
                    <p style="font-weight:900; margin:10px 0">${detected.join(' + ').toUpperCase()}</p>
                    <button class="btn-ios" style="background:white; font-size:12px" onclick="location.reload()">NUEVA LECTURA</button>
                </div>`;
                const speech = new SpeechSynthesisUtterance("¡Peligro! No usar.");
                window.speechSynthesis.speak(speech);
            } else {
                res.innerHTML = `<div class="glass-card" style="border-color:var(--gr)">
                    <h1 style="color:var(--gr); margin:0">✅ SEGURO</h1>
                    <p>Escudo Limpio. Puedes usarlo.</p>
                    <button class="btn-ios" style="background:var(--gr); color:black; font-size:12px" onclick="location.reload()">SIGUIENTE</button>
                </div>`;
            }
        } catch (error) {
            console.error('Error al escanear:', error);
            res.innerHTML = '<div class="glass-card danger-ui">⚠️ Falló el escaneo OCR. Intenta con más luz y enfoca mejor la etiqueta.</div>';
            document.getElementById('scan-ui').style.display = 'block';
        }
    }

    // --- LISTA COMPRA INTELIGENTE ---
    function addToList() {
        const val = document.getElementById('list-in').value;
        if(!val) return;
        shopping.push(val);
        localStorage.setItem('e_list_24', JSON.stringify(shopping));
        document.getElementById('list-in').value = '';
        renderShopping();
    }

    function renderShopping() {
        document.getElementById('list-cont').innerHTML = shopping.slice().reverse().map(i => `<div class="glass-card" style="padding:15px">${i}</div>`).join('');
    }

    function renderBlacklist() {
        document.getElementById('black-cont').innerHTML = blacklist.slice().reverse().map(i => `<div class="glass-card danger-ui" style="padding:15px"><b>${i.date}</b><br><small>${i.items.join(', ')}</small></div>`).join('');
    }

    // --- TICKETS Y DINERO ---
    async function scanTicket() {
        alert("Enfoca el TOTAL de tu ticket...");
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
        const match = text.match(/\d+[,.]\d{2}/);
        if(match) {
            totalSpent += parseFloat(match[0].replace(',', '.'));
            localStorage.setItem('e_money_24', totalSpent);
            updateMoney();
        }
    }

    function updateMoney() {
        document.getElementById('money-cont').innerText = totalSpent.toFixed(2) + "€";
    }

    renderShopping();
    renderBlacklist();
    updateMoney();
</script>
</body>
</html>
