<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emerge - Hyper-Neural V9</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --cy: #00F2FF; --mg: #FF0055; --gr: #00FF9F; --bg: #000; --gl: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg); color: white; margin: 0; 
            font-family: -apple-system, sans-serif; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.08) 0%, transparent 80%);
        }

        header { 
            padding: calc(env(safe-area-inset-top) + 15px) 20px 15px; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--cy); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { width: 45px; filter: drop-shadow(0 0 10px var(--cy)); }

        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .screen { display: none; }
        .active { display: block; animation: iosIn 0.5s cubic-bezier(0.1, 0.9, 0.2, 1); }
        @keyframes iosIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Cámara Pro con Marco Dinámico */
        .camera-container { 
            width: 100%; height: 360px; border-radius: 45px; 
            border: 3px solid var(--cy); overflow: hidden; position: relative;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { position: absolute; top: 0; width: 100%; height: 2px; background: var(--cy); box-shadow: 0 0 15px var(--cy); animation: scanLine 2s infinite linear; }
        @keyframes scanLine { 0% { top: 0%; } 100% { top: 100%; } }

        /* Tarjeta de Resultado "Súper App" */
        .result-card {
            background: rgba(0, 0, 0, 0.85); border-radius: 40px; 
            padding: 30px; margin-top: -60px; position: relative; z-index: 10;
            border: 2px solid var(--cy); backdrop-filter: blur(25px);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .social-stats { font-size: 11px; color: var(--cy); font-weight: 800; margin-bottom: 10px; background: rgba(0,242,255,0.1); padding: 6px 15px; border-radius: 20px; display: inline-block; }
        .star-rating { color: #FFD700; font-size: 20px; margin: 10px 0; }

        .btn-ios {
            background: var(--cy); color: black; border: none; width: 100%;
            padding: 22px; border-radius: 25px; font-size: 18px; font-weight: 900;
            margin-top: 15px; box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3);
        }
        .btn-ios:active { transform: scale(0.95); opacity: 0.8; }

        nav {
            position: fixed; bottom: 0; width: 100%; 
            padding: 15px 0 calc(env(safe-area-inset-bottom) + 10px);
            background: rgba(0,0,0,0.95); backdrop-filter: blur(30px);
            display: flex; justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000;
        }
        .nav-item { color: #555; text-align: center; font-size: 11px; font-weight: 800; }
        .nav-item.active { color: var(--cy); text-shadow: 0 0 10px var(--cy); }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="font-size: 11px; font-weight: 900; color: var(--cy); letter-spacing: 3px;">HYPER-NEURAL V9</div>
    <i data-lucide="zap" style="color:var(--cy); width:20px"></i>
</header>

<div class="main-content">
    <div id="scr-scan" class="screen active">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="scan-line"></div>
        </div>
        
        <div id="ui-box">
            <button class="btn-ios" onclick="startNeuralScan()">ESCANEAR PRODUCTO</button>
        </div>
        
        <div id="result-area"></div>
    </div>

    <div id="scr-data" class="screen">
        <h2 style="color:var(--cy)">DESPENSA NEURAL</h2>
        <div id="history-list"></div>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="camera"></i><br>SCAN</div>
    <div class="nav-item" onclick="nav('scr-data', this)"><i data-lucide="database"></i><br>DATA</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    let history = JSON.parse(localStorage.getItem('v9_data') || '[]');

    // Audio Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d) {
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + d);
    }

    // Base de datos Elias con Pesos
    const ELIAS_DB = {
        "Methylisothiazolinone": { risk: 100, syn: ["methylisothiazolinone", "mit", "mi"] },
        "Isotiazolinonas": { risk: 90, syn: ["benzisothiazolinone", "methylchloroisothiazolinone", "bit", "mci"] },
        "Fragancias": { risk: 40, syn: ["linalool", "citronellol", "hexyl cinnamal", "parfum"] }
    };

    const flatList = Object.values(ELIAS_DB).map(d => d.syn).flat();

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(id === 'scr-data') renderHistory();
    }

    async function startNeuralScan() {
        const res = document.getElementById('result-area');
        const ui = document.getElementById('ui-box');
        
        ui.style.display = 'none';
        res.innerHTML = '<div class="result-card">🧠 CALCULANDO INTELIGENCIA COLECTIVA...</div>';
        beep(800, 'sine', 0.2);

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
        const cleanText = text.toLowerCase();
        
        let maxRisk = 0; let detected = [];
        for (const [name, data] of Object.entries(ELIAS_DB)) {
            if (data.syn.some(s => cleanText.includes(s))) {
                if (data.risk > maxRisk) maxRisk = data.risk;
                detected.push(name);
            }
        }

        // Datos de Comunidad (Simulados Pro)
        const people = Math.floor(Math.random() * 5000) + 1200;
        const stars = maxRisk > 0 ? "★☆☆☆☆" : "★★★★★";
        const safetyMessage = maxRisk > 0 ? "RECHAZADO POR LA COMUNIDAD" : "PRODUCTO RECOMENDADO";

        if (maxRisk > 0) {
            beep(150, 'sawtooth', 0.6); if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
            history.push({ date: new Date().toLocaleString(), risk: maxRisk, items: detected });
            localStorage.setItem('v9_data', JSON.stringify(history));
        } else {
            beep(1200, 'sine', 0.2);
        }

        res.innerHTML = `
            <div class="result-card" style="border-color:${maxRisk > 0 ? 'var(--mg)' : 'var(--gr)'}">
                <div class="social-stats">👁️ ESCANEADO POR ${people} PERSONAS</div>
                <div class="star-rating">${stars}</div>
                <h2 style="color:${maxRisk > 0 ? 'var(--mg)' : 'var(--gr)'}; margin:0">${maxRisk}% RIESGO</h2>
                <p style="font-size:12px; font-weight:bold; letter-spacing:1px">${safetyMessage}</p>
                <p style="font-size:10px; opacity:0.6">${detected.join(' • ')}</p>
                <button class="btn-ios" style="background:rgba(255,255,255,0.1); color:white; font-size:12px" onclick="resetUI()">NUEVO ANÁLISIS</button>
            </div>`;
    }

    function resetUI() {
        document.getElementById('result-area').innerHTML = '';
        document.getElementById('ui-box').style.display = 'block';
    }

    function renderHistory() {
        const cont = document.getElementById('history-list');
        if(history.length === 0) { cont.innerHTML = '<p style="text-align:center; opacity:0.3">HISTORIAL VACÍO</p>'; return; }
        cont.innerHTML = history.slice().reverse().map(h => `
            <div class="result-card" style="margin-top:10px; text-align:left; padding:15px; border-color:${h.risk >= 80 ? 'var(--mg)' : 'var(--cy)'}">
                <div style="font-size:10px; color:var(--cy)">${h.date} | RIESGO: ${h.risk}%</div>
                <div style="font-weight:bold">${h.items.join(', ')}</div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
