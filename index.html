<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emerge Detector - Neural Shield</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --cyan: #00F2FF; --magenta: #FF0055; --green: #00FF9F; --bg: #000000; --glass: rgba(255, 255, 255, 0.06); --ios-blur: blur(25px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, 'SF Pro Display', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 80%), linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px); background-size: 100% 100%, 40px 40px, 40px 40px; }
        header { padding: calc(env(safe-area-inset-top) + 20px) 20px 20px; text-align: center; background: rgba(0, 0, 0, 0.8); backdrop-filter: var(--ios-blur); border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .logo { width: 55px; filter: drop-shadow(0 0 15px var(--cyan)); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .screen { display: none; }
        .active { display: block; animation: iosIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes iosIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .camera-container { width: 100%; height: 400px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 242, 255, 0.1); }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scan-bar { position: absolute; top: 0; width: 100%; height: 100px; background: linear-gradient(to bottom, var(--cyan), transparent); opacity: 0.3; animation: scanMove 3s infinite ease-in-out; pointer-events: none; }
        @keyframes scanMove { 0%, 100% { top: -10%; } 50% { top: 90%; } }
        .btn-ios { background: var(--cyan); color: black; border: none; width: 100%; padding: 20px; border-radius: 22px; font-size: 17px; font-weight: 700; margin-top: 25px; letter-spacing: -0.5px; box-shadow: 0 10px 25px rgba(0, 242, 255, 0.3); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-ios:active { transform: scale(0.95); opacity: 0.8; }
        .glass-card { background: var(--glass); border-radius: 30px; padding: 25px; margin-top: 25px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: var(--ios-blur); box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .danger-alert { border-color: var(--magenta); background: rgba(255, 0, 85, 0.1); animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        nav { position: fixed; bottom: 0; width: 100%; padding: 15px 0 calc(env(safe-area-inset-bottom) + 10px); background: rgba(0, 0, 0, 0.85); backdrop-filter: var(--ios-blur); display: flex; justify-content: space-around; border-top: 0.5px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .nav-item { color: #666; text-align: center; font-size: 11px; font-weight: 600; transition: 0.3s; }
        .nav-item.active { color: var(--cyan); }
        .nav-item i { margin-bottom: 4px; display: block; margin: 0 auto 5px; }
    </style>
</head>
<body>
<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div id="status" style="font-size: 10px; color: var(--cyan); letter-spacing: 5px; margin-top: 10px; font-weight: 800; text-transform: uppercase;">Neural Guard</div>
</header>
<div class="main-content">
    <div id="scr-scan" class="screen active">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="scan-bar"></div>
            <div style="position:absolute; bottom:20px; left:20px; font-size:10px; color:var(--cyan); background:rgba(0,0,0,0.6); padding:6px 12px; border-radius:12px; border:0.5px solid var(--cyan)">AI_POWERED_V3</div>
        </div>
        <button class="btn-ios" onclick="analyzeIngredients()">ANALIZAR ETIQUETA</button>
        <div id="result-display"></div>
    </div>
    <div id="scr-memory" class="screen">
        <h2 style="letter-spacing: -1px; margin-bottom: 5px;">Historial Neural</h2>
        <div id="history-container"></div>
        <button class="btn-ios" style="background:none; border:1px solid var(--magenta); color:var(--magenta); margin-top:40px" onclick="clearData()">Limpiar Base de Datos</button>
    </div>
    <div id="scr-impact" class="screen">
        <h2 style="letter-spacing: -1px;">Impacto de Salud</h2>
        <div class="glass-card"><canvas id="impactChart"></canvas></div>
        <div class="glass-card" style="text-align:center;">
            <div style="font-size:50px; color:var(--cyan); font-weight:800" id="stat-count">0</div>
            <div style="font-size:11px; font-weight:700; opacity:0.6; letter-spacing:1px">AMENAZAS EVITADAS</div>
        </div>
    </div>
</div>
<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="camera"></i>ESCÁNER</div>
    <div class="nav-item" onclick="nav('scr-memory', this)"><i data-lucide="database"></i>MEMORIA</div>
    <div class="nav-item" onclick="nav('scr-impact', this)"><i data-lucide="bar-chart-2"></i>IMPACTO</div>
</nav>
<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    let history = JSON.parse(localStorage.getItem('neural_history') || '[]');
    const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d) {
        const osc = ctxAudio.createOscillator(); const g = ctxAudio.createGain();
        osc.type = t; osc.frequency.value = f; g.gain.setValueAtTime(0.1, ctxAudio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + d);
        osc.connect(g); g.connect(ctxAudio.destination); osc.start(); osc.stop(ctxAudio.currentTime + d);
    }
    const badChems = ['methylisothiazolinone', 'methylchloroisothiazolinone', 'benzisothiazolinone', 'linalool', 'citronellol', 'limonene', 'geraniol', 'hexyl cinnamal', 'benzyl alcohol', 'phenoxyethanol'];
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);
    function nav(id, el) {
        beep(500, 'sine', 0.1);
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(id === 'scr-memory') renderHistory();
        if(id === 'scr-impact') renderStats();
    }
    async function analyzeIngredients() {
        const display = document.getElementById('result-display');
        display.innerHTML = '<div class="glass-card">⚙️ PROCESANDO RED NEURAL...</div>';
        beep(800, 'sine', 0.2);
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        try {
            const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
            const found = badChems.filter(c => text.toLowerCase().includes(c));
            if (found.length > 0) {
                beep(200, 'square', 0.3); if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                history.push({ date: new Date().toLocaleString(), items: found });
                localStorage.setItem('neural_history', JSON.stringify(history));
                display.innerHTML = `<div class="glass-card danger-alert"><div style="color:var(--magenta); font-weight:800; font-size:22px; margin-bottom:10px">¡PELIGRO!</div><div style="font-size:14px; font-weight:700; color:white">${found.join(' • ').toUpperCase()}</div></div>`;
            } else {
                beep(1200, 'sine', 0.1);
                display.innerHTML = `<div class="glass-card" style="border-color:var(--green)"><div style="color:var(--green); font-weight:800; font-size:22px; margin-bottom:10px">SEGURO</div><p style="margin:0; opacity:0.8">Etiqueta verificada.</p></div>`;
            }
        } catch (e) { display.innerHTML = '<div class="glass-card">⚠️ ERROR ÓPTICO</div>'; }
    }
    function renderHistory() {
        const cont = document.getElementById('history-container');
        if(history.length === 0) { cont.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.3">HISTORIAL VACÍO</div>'; return; }
        cont.innerHTML = history.slice().reverse().map(i => `<div class="glass-card" style="padding:15px; margin-top:10px"><div style="font-size:10px; color:var(--cyan); margin-bottom:5px">${i.date}</div><div style="font-weight:700; color:var(--magenta)">${i.items.join(', ')}</div></div>`).join('');
    }
    function renderStats() {
        document.getElementById('stat-count').innerText = history.length;
        const ctx = document.getElementById('impactChart').getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: ['1', '2', '3', '4', '5'], datasets: [{ data: history.slice(-5).map(h => h.items.length), borderColor: '#00F2FF', backgroundColor: 'rgba(0,242,255,0.1)', fill: true, tension: 0.5 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } } });
    }
    function clearData() { if(confirm("¿ELIMINAR TODO?")) { localStorage.clear(); history = []; renderHistory(); } }
</script>
</body>
</html>
