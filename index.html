<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emerge - Social Shield V8</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --cy: #00F2FF; --mg: #FF0055; --gr: #00FF9F; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: white; margin: 0; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.05) 0%, transparent 80%); }
        header { padding: calc(env(safe-area-inset-top) + 15px) 20px 15px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); border-bottom: 2px solid var(--cy); text-align: center; }
        .logo { width: 45px; filter: drop-shadow(0 0 10px var(--cy)); }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .screen { display: none; }
        .active { display: block; }
        .camera-container { width: 100%; height: 350px; border-radius: 40px; border: 3px solid var(--cy); overflow: hidden; position: relative; box-shadow: 0 0 30px rgba(0, 242, 255, 0.4); }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .result-card { background: rgba(0, 0, 0, 0.9); border-radius: 35px; padding: 25px; margin-top: -60px; position: relative; z-index: 10; border: 2px solid var(--cy); backdrop-filter: blur(20px); text-align: center; }
        .community-tag { font-size: 10px; color: var(--cy); background: rgba(0,242,255,0.1); padding: 5px 12px; border-radius: 10px; display: inline-block; margin-bottom: 10px; }
        .risk-meter { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--cy); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; }
        .btn-main { background: var(--cy); color: black; border: none; width: 100%; padding: 20px; border-radius: 22px; font-size: 18px; font-weight: 900; margin-top: 15px; box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3); }
        nav { position: fixed; bottom: 0; width: 100%; padding: 15px 0 calc(env(safe-area-inset-bottom) + 10px); background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item { color: #444; text-align: center; font-size: 10px; font-weight: 800; }
        .nav-item.active { color: var(--cy); }
    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="font-size: 11px; font-weight: 900; color: var(--cy); letter-spacing: 3px;">SOCIAL SHIELD V8</div>
</header>

<div class="main-content">
    <div id="scr-scan" class="screen active">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="ui-box">
            <button class="btn-main" onclick="startSocialAnalysis()">ESCANEAR PRODUCTO</button>
        </div>
        <div id="result-display"></div>
    </div>

    <div id="scr-data" class="screen">
        <h2 style="color:var(--cy)">DATOS COMUNIDAD</h2>
        <div id="community-stats" class="result-card">
            <p>Cargando datos globales...</p>
        </div>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="nav('scr-scan', this)"><i data-lucide="scan"></i><br>SCAN</div>
    <div class="nav-item" onclick="nav('scr-data', this)"><i data-lucide="globe"></i><br>SOCIAL</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    
    // --- CONFIGURACIÓN SUPABASE (PON TUS LLAVES AQUÍ) ---
    const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
    const SUPABASE_KEY = 'TU_ANON_KEY';
    const supabase = (SUPABASE_URL !== 'https://TU_PROYECTO.supabase.co') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // BASE DE DATOS ELIAS
    const RISK_DB = {
        "Methylisothiazolinone": { weight: 100, synonyms: ["methylisothiazolinone", "mit", "mi"] },
        "Isotiazolinonas": { weight: 90, synonyms: ["benzisothiazolinone", "methylchloroisothiazolinone"] },
        "Alergenos Fragancia": { weight: 40, synonyms: ["linalool", "citronellol", "hexyl cinnamal"] }
    };

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);

    async function startSocialAnalysis() {
        const display = document.getElementById('result-display');
        const ui = document.getElementById('ui-box');
        ui.style.display = 'none';
        display.innerHTML = '<div class="result-card">🧠 ANALIZANDO Y SINCRONIZANDO...</div>';

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
        const cleanText = text.toLowerCase();
        
        let maxRisk = 0; let detected = [];
        for (const [name, data] of Object.entries(RISK_DB)) {
            if (data.synonyms.some(s => cleanText.includes(s))) {
                if (data.weight > maxRisk) maxRisk = data.weight;
                detected.push(name);
            }
        }

        // SIMULACIÓN DE DATOS DE COMUNIDAD (O Supabase si lo tienes configurado)
        const scanCount = Math.floor(Math.random() * 2000) + 500;
        const rejectRate = maxRisk > 0 ? 85 + Math.floor(Math.random() * 10) : 5;

        display.innerHTML = `
            <div class="result-card" style="border-color:${maxRisk > 0 ? 'var(--mg)' : 'var(--gr)'}">
                <div class="community-tag">👁️ ESCANEADO POR ${scanCount} PERSONAS</div>
                <div class="risk-meter" style="color:${maxRisk > 0 ? 'var(--mg)' : 'var(--gr)'}; border-color:${maxRisk > 0 ? 'var(--mg)' : 'var(--gr)'}">${maxRisk}%</div>
                <h3>${maxRisk > 0 ? 'PELIGRO DETECTADO' : 'PRODUCTO SEGURO'}</h3>
                <p style="font-size:12px">${rejectRate}% de la comunidad ha rechazado este producto.</p>
                <button class="btn-main" style="background:rgba(255,255,255,0.1); color:white; font-size:12px" onclick="location.reload()">NUEVO ESCANEO</button>
            </div>`;

        // Aquí iría la lógica para enviar el dato a Supabase
        if(supabase) {
            await supabase.from('escaneos').insert([{ riesgo: maxRisk, alergenos: detected }]);
        }
    }

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
