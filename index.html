<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EMERGE // NEURAL CORE</title>
    
    <!-- Apple Elite Experience Config -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg">
    <link rel="manifest" href="manifest.json">

    <!-- Core Engines -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --cy: #00F2FF; --mg: #FF0055; --gr: #00FF9F; --bg: #000;
            --glass: rgba(255, 255, 255, 0.05); --blur: blur(30px);
            --neon-glow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg); color: white; margin: 0; 
            font-family: -apple-system, 'SF Pro Display', sans-serif;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* NAVEGACIÓN SUPERIOR - ADAPTIVE ISLAND */
        header { 
            padding: calc(env(safe-area-inset-top) + 10px) 25px 15px;
            background: rgba(0,0,0,0.8); backdrop-filter: var(--blur);
            border-bottom: 0.5px solid rgba(255,255,255,0.1); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { width: 42px; filter: drop-shadow(0 0 10px var(--cy)); border-radius: 12px; }
        .status-dot { width: 8px; height: 8px; background: var(--gr); border-radius: 50%; box-shadow: 0 0 10px var(--gr); }

        /* SCROLLABLE CORE */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; scroll-behavior: smooth; }
        .screen { display: none; }
        .active { display: block; animation: iosScale 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes iosScale { from { opacity: 0; transform: scale(1.1); filter: blur(10px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }

        /* VISOR NEURAL V12 */
        .camera-vault {
            width: 100%; height: 380px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden; position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), var(--neon-glow);
        }
        #video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.5s; }
        .scan-frame { position: absolute; inset: 20px; border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 35px; pointer-events: none; }
        .scan-laser { position: absolute; top: 0; width: 100%; height: 100px; background: linear-gradient(to bottom, var(--cy), transparent); opacity: 0.1; animation: scanAnim 3s infinite ease-in-out; }
        @keyframes scanAnim { 0%, 100% { top: -10%; } 50% { top: 90%; } }

        /* TARJETAS PREMIUM */
        .glass-card {
            background: var(--glass); border-radius: 35px; padding: 25px;
            margin-top: 25px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: var(--blur); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .glass-card:active { transform: scale(0.98); }

        /* BOTONES iPHONE ELITE */
        .btn-core {
            background: var(--cy); color: black; border: none; width: 100%;
            padding: 24px; border-radius: 25px; font-size: 18px; font-weight: 800;
            letter-spacing: -0.5px; box-shadow: 0 15px 30px rgba(0, 242, 255, 0.3);
            margin-top: 20px; transition: 0.3s;
        }
        .btn-core:active { transform: translateY(4px); box-shadow: 0 5px 15px rgba(0, 242, 255, 0.2); }

        /* TAB BAR PREMIUM */
        nav {
            position: fixed; bottom: 0; width: 100%; 
            padding: 15px 0 calc(env(safe-area-inset-bottom) + 5px);
            background: rgba(0, 0, 0, 0.9); backdrop-filter: var(--bl);
            display: flex; justify-content: space-around;
            border-top: 0.5px solid rgba(255, 255, 255, 0.1); z-index: 1000;
        }
        .nav-item { color: #555; text-align: center; font-size: 11px; font-weight: 700; transition: 0.3s; }
        .nav-item.active { color: var(--cy); transform: translateY(-5px); }
        .nav-item i { display: block; margin: 0 auto 6px; width: 22px; }

        .risk-badge { padding: 5px 15px; border-radius: 12px; font-size: 10px; font-weight: 900; letter-spacing: 1px; }

    </style>
</head>
<body>

<header>
    <img src="https://i.postimg.cc/BPZZBVx0/d705a01b-7dd0-45d9-a218-c148cec7b991.jpg" class="logo">
    <div style="text-align: center;">
        <div style="font-size: 12px; font-weight: 900; color: white; letter-spacing: 1px;">NEURAL CORE</div>
        <div style="font-size: 8px; color: var(--cy); letter-spacing: 3px;">SYSTEM ACTIVE</div>
    </div>
    <div class="status-dot"></div>
</header>

<div class="main-content">
    
    <!-- P1: SCANNER PRO -->
    <div id="scr-scan" class="screen active">
        <div class="camera-vault">
            <video id="video" autoplay playsinline></video>
            <div class="scan-frame"></div>
            <div class="scan-laser"></div>
        </div>
        <div id="ui-main">
            <button class="btn-core" onclick="triggerNeuralAnalysis()">INICIAR ANÁLISIS BIO-QUÍMICO</button>
        </div>
        <div id="result-area"></div>
    </div>

    <!-- P2: LISTA NEURAL -->
    <div id="scr-list" class="screen">
        <h2 style="font-size: 32px; letter-spacing: -1.5px;">Lista Inteligente</h2>
        <div class="glass-card" style="display:flex; gap:15px">
            <input type="text" id="input-item" placeholder="Escribe un producto..." 
                   style="background:none; border:none; color:white; flex:1; font-size:18px">
            <button onclick="saveToList()" style="background:var(--cy); border:none; border-radius:15px; padding:10px 20px; font-weight:800">AÑADIR</button>
        </div>
        <div id="neural-list-items"></div>
    </div>

    <!-- P3: HOGAR & GASTOS -->
    <div id="scr-home" class="screen">
        <h2 style="font-size: 32px; letter-spacing: -1.5px;">Salud del Hogar</h2>
        <div class="glass-card" style="text-align:center">
            <canvas id="homeChart" style="max-height:200px"></canvas>
            <div style="margin-top:20px; font-size:14px; opacity:0.6">INDICE DE PUREZA DEL HOGAR</div>
            <div style="font-size:42px; font-weight:900; color:var(--gr)" id="purity-score">100%</div>
        </div>
        <div id="home-history"></div>
    </div>

</div>

<nav>
    <div class="nav-item active" onclick="navigate('scr-scan', this)"><i data-lucide="aperture"></i>CORE</div>
    <div class="nav-item" onclick="navigate('scr-list', this)"><i data-lucide="shopping-bag"></i>LISTA</div>
    <div class="nav-item" onclick="navigate('scr-home', this)"><i data-lucide="shield-check"></i>HOGAR</div>
</nav>

<script>
    lucide.createIcons();
    const video = document.getElementById('video');
    let scanHistory = JSON.parse(localStorage.getItem('elias_v12_history') || '[]');
    let myShoppingList = JSON.parse(localStorage.getItem('elias_v12_list') || '[]');

    // --- SONIDO DE ALTA FIDELIDAD (WEBAUDIO) ---
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audio.currentTime);
        g.gain.setValueAtTime(0.1, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + duration);
    }

    // --- BASE DE DATOS MAESTRA ELIAS (STRICT MODE) ---
    const MASTER_ALERGENOS = {
        "Methylisothiazolinone": { risk: 100, pattern: /\b(methylisothiazolinone|mit|mi|2-methyl-4-isothiazolin-3-one)\b/i },
        "Isotiazolinonas": { risk: 90, pattern: /\b(methylchloroisothiazolinone|benzisothiazolinone|cmit|mci|bit|isothiazolinone|proxel)\b/i },
        "Linalool": { risk: 40, pattern: /\b(linalool|linalol|78-70-6|licareol|coriandrol)\b/i },
        "Citronellol": { risk: 40, pattern: /\b(citronellol|106-22-9|fema 2309)\b/i },
        "Fragancias": { risk: 65, pattern: /\b(parfum|fragrance|arome|hexyl cinnamal|hca|101-86-0)\b/i }
    };

    // Cámara
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', focusMode: 'continuous' } }).then(s => video.srcObject = s);

    function navigate(id, el) {
        playBeep(600, 'sine', 0.1);
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(id === 'scr-list') renderNeuralList();
        if(id === 'scr-home') renderHomeShield();
    }

    async function triggerNeuralAnalysis() {
        const resultArea = document.getElementById('result-area');
        const uiMain = document.getElementById('ui-main');
        
        uiMain.style.display = 'none';
        resultArea.innerHTML = '<div class="glass-card" style="text-align:center">🧠 CONECTANDO CON NÚCLEO NEURAL...</div>';
        playBeep(880, 'sine', 0.2);
        if(navigator.vibrate) navigator.vibrate(10);

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        try {
            const { data: { text } } = await Tesseract.recognize(canvas, 'spa+eng');
            let detected = []; let maxRisk = 0;

            for (let [name, data] of Object.entries(MASTER_ALERGENOS)) {
                if (data.pattern.test(text)) {
                    detected.push(name);
                    if (data.risk > maxRisk) maxRisk = data.risk;
                }
            }

            processFinalResult(maxRisk, detected);
        } catch (e) { resetAnalysis(); }
    }

    function processFinalResult(risk, items) {
        const area = document.getElementById('result-area');
        const isDanger = risk > 0;
        
        if(isDanger) {
            playBeep(110, 'sawtooth', 0.5);
            if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
            
            scanHistory.push({ date: new Date().toLocaleString(), risk, items });
            localStorage.setItem('elias_v12_history', JSON.stringify(scanHistory));

            area.innerHTML = `
                <div class="glass-card" style="border-color:var(--mg); background:rgba(255,0,85,0.05)">
                    <div style="font-size:10px; color:var(--mg); font-weight:900; letter-spacing:2px">DETECCIÓN CRÍTICA</div>
                    <h2 style="color:var(--mg); margin:10px 0; font-size:32px">${risk}% RIESGO</h2>
                    <div style="font-weight:700; opacity:0.8">${items.join(' + ').toUpperCase()}</div>
                    <button class="btn-core" style="background:white; color:black; font-size:12px; padding:15px" onclick="resetAnalysis()">DESCARTAR Y RE-ESCANEAR</button>
                    <button class="btn-core" style="background:var(--mg); color:white; font-size:12px; padding:15px; margin-top:10px" onclick="window.open('https://www.amazon.es/s?k=natural+allergy+free')">BUSCAR ALTERNATIVA</button>
                </div>`;
            
            // Voz
            const msg = new SpeechSynthesisUtterance("Alerta. Riesgo del " + risk + " por ciento detectado.");
            msg.lang = 'es-ES'; window.speechSynthesis.speak(msg);

        } else {
            playBeep(440, 'sine', 0.2);
            area.innerHTML = `
                <div class="glass-card" style="border-color:var(--gr); background:rgba(0,255,159,0.05)">
                    <div style="font-size:10px; color:var(--gr); font-weight:900; letter-spacing:2px">ESCUDO VERIFICADO</div>
                    <h2 style="color:var(--gr); margin:10px 0; font-size:32px">0% RIESGO</h2>
                    <div style="font-weight:700; opacity:0.8">PRODUCTO SEGURO PARA ELIAS</div>
                    <button class="btn-core" style="background:white; color:black; font-size:12px; padding:15px" onclick="resetAnalysis()">NUEVO ANÁLISIS</button>
                </div>`;
        }
    }

    function resetAnalysis() {
        document.getElementById('result-area').innerHTML = '';
        document.getElementById('ui-main').style.display = 'block';
        playBeep(300, 'sine', 0.1);
    }

    // --- LISTA NEURAL ---
    function saveToList() {
        const val = document.getElementById('input-item').value;
        if(!val) return;
        const knownDanger = scanHistory.some(h => h.items.some(i => i.toLowerCase().includes(val.toLowerCase())));
        myShoppingList.push({ name: val, danger: knownDanger });
        localStorage.setItem('elias_v12_list', JSON.stringify(myShoppingList));
        document.getElementById('input-item').value = '';
        renderNeuralList();
    }

    function renderNeuralList() {
        const cont = document.getElementById('neural-list-items');
        cont.innerHTML = myShoppingList.map((item, i) => `
            <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-color:${item.danger ? 'var(--mg)' : 'rgba(255,255,255,0.1)'}">
                <span style="font-weight:700">${item.name}</span>
                <span class="risk-badge" style="background:${item.danger ? 'var(--mg)' : 'var(--cy)'}; color:black">
                    ${item.danger ? 'RECHAZADO PREVIAMENTE' : 'LISTO'}
                </span>
            </div>
        `).join('');
    }

    // --- HOGAR SHIELD ---
    function renderHomeShield() {
        const score = 100 - (scanHistory.length * 5);
        document.getElementById('purity-score').innerText = Math.max(score, 0) + "%";
        const ctx = document.getElementById('homeChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Safe', 'Toxic'], datasets: [{ data: [score, 100-score], backgroundColor: ['#00FF9F', '#FF0055'], borderWidth: 0 }] },
            options: { plugins: { legend: { display: false } }, cutout: '85%' }
        });
        
        const hist = document.getElementById('home-history');
        hist.innerHTML = scanHistory.slice().reverse().map(h => `
            <div class="glass-card" style="padding:15px; font-size:12px; border-left:4px solid var(--mg)">
                <b>${h.items.join(', ')}</b><br><span style="opacity:0.5">${h.date}</span>
            </div>
        `).join('');
    }
</script>
</body>
</html>
